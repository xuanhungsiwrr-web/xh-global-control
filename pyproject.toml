[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xh-global-control"
version = "0.1.0"
description = "Thin global policy and control plane for XH-AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
xhctl = "xh_control.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xh_control = ["state/migrations/*.sql"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

